<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="reject-advertising-hook — keeps Claude attribution out of commits, PRs and comments">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F43F5E"/><stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#0B1120"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <!-- commit message with its trailer struck out -->
  <rect x="872" y="104" width="276" height="176" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="892" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#E2E8F0">fix: cache routes in CI</text>
  <rect x="892" y="154" width="200" height="8" rx="4" fill="#334155"/>
  <rect x="892" y="172" width="152" height="8" rx="4" fill="#334155"/>
  <text x="892" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#64748B">Co-Authored-By: Claude</text>
  <line x1="888" y1="209" x2="1086" y2="209" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <rect x="1060" y="238" width="72" height="26" rx="13" fill="#F43F5E" fill-opacity="0.14" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="1096" y="256" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#FDA4AF">denied</text>
  <!-- wordmark -->
  <text x="72" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-0.04em" fill="url(#accent)">reject-advertising-hook</text>
  <text x="76" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#94A3B8">Keeps Claude attribution out of commits, PRs and comments.</text>
  <!-- crafted-by mark -->
  <text x="1180" y="344" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="800" font-style="italic" letter-spacing="0.02em" fill="#94A3B8">CRAFTED BY</text>
  <text x="1180" y="362" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="-0.07em"><tspan fill="url(#accent)">DASHWORTHY</tspan></text>
</svg>
